<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="alpha_crm">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>alpha_crm</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Thêm script lắng nghe SSO Token từ Alpha Studio -->
  <script>
    window.addEventListener("message", (event) => {
      if (event.data) {
        let parsedData = event.data;
        if (typeof parsedData === 'string' && parsedData.trim().startsWith('{')) {
          try {
            parsedData = JSON.parse(parsedData);
          } catch (e) {}
        }
        if (parsedData.type === 'AUTH_TOKEN' && parsedData.token) {
          const token = parsedData.token;
          console.log("Đã nhận Token từ Alpha Studio");
          window.localStorage.setItem('alpha_studio_token', token);
        }
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
